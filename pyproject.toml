[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "papaya"
version = "0.1.0"
description = "A small Python framework for building AI agents."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/papaya"]
